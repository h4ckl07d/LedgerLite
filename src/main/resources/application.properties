
spring.application.name=LedgerLite

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ledgerlite}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:ledgerlite}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:ledgerlite123456@}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT configuration
jwt.secret=${SECRET_KEY:T+HD/hBSgSxGljv59zyKjBsaCM97DzYtnH0zL+G68pc=}

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.org.springframework.security=DEBUG

# Disable automatic Docker Compose lifecycle management
# We will start PostgreSQL manually during local development.
spring.docker.compose.enabled=false
